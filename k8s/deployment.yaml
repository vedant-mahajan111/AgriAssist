apiVersion: apps/v1
kind: Deployment
metadata:
  name: agriassist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agriassist
  template:
    metadata:
      labels:
        app: agriassist
    spec:
      containers:
        - name: agriassist
          image: vedant1407/agriassist:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: MYSQL_HOST
              value: mysql-service
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: agriassist_app
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agriassist-app-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              value: agriassist_db
